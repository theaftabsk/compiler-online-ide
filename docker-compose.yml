version: '3.8'

services:
  # Backend API & WebSocket Service
  lab-backend:
    build:
      context: ./backned
      dockerfile: Dockerfile
    container_name: university_codelab_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/codelab_db
      - JWT_SECRET=university_super_secure_jwt_token_2026
    depends_on:
      - postgres
      - redis

  # Frontend Web Client
  lab-frontend:
    build:
      context: ./fronted
      dockerfile: Dockerfile
    container_name: university_codelab_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - lab-backend

  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: codelab_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: codelab_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Redis In-Memory Cache & WebSocket PubSub
  redis:
    image: redis:7-alpine
    container_name: codelab_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
